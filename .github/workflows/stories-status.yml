name: Sync Story Status

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened, closed]
  push:
    branches: [main]
    paths:
      - DOCS/STORIES.md

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: sync-story-status
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Status Column
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Update DOCS/STORIES.md status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-stories-status.mjs

      - name: Create Pull Request for Story Status
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: sync story status [skip ci]"
          title: "chore: sync story status"
          body: "Automated PR to sync story status."
          branch: "chore/sync-story-status"
          base: main
          add-paths: DOCS/STORIES.md
