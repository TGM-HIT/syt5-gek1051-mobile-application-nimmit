name: Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Run coverage tests
        run: npm run test:coverage

      - name: Generate coverage badge
        run: |
          mkdir -p .github/badges
          read -r COVERAGE_PCT BADGE_COLOR < <(node -e "const fs=require('fs'); const summary=JSON.parse(fs.readFileSync('coverage/nimmit/coverage-summary.json','utf8')); const pct=Number(summary?.total?.lines?.pct ?? summary?.total?.statements?.pct ?? 0); const rounded=(Math.round(pct*100)/100).toFixed(2); let color='red'; if(pct>=90) color='brightgreen'; else if(pct>=80) color='green'; else if(pct>=70) color='yellowgreen'; else if(pct>=60) color='yellow'; else if(pct>=50) color='orange'; process.stdout.write(rounded + ' ' + color + '\n');")
          curl -sSLo .github/badges/coverage.svg -L "https://img.shields.io/badge/coverage-${COVERAGE_PCT}%25-${BADGE_COLOR}.svg"

      - name: Create Pull Request for Coverage Badge
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update coverage badge [skip ci]"
          title: "chore: update coverage badge"
          body: "Automated PR to update coverage badge."
          branch: "chore/update-coverage-badge"
          base: main
          add-paths: .github/badges/coverage.svg

      - name: Upload coverage to Codecov (token)
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage/nimmit/lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage to Codecov (OIDC fallback)
        if: ${{ env.CODECOV_TOKEN == '' }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage/nimmit/lcov.info
          use_oidc: true
          disable_search: true
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
