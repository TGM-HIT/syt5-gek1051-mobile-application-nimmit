name: Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Run coverage tests
        run: npm run test:coverage

      - name: Generate coverage badge
        run: |
          mkdir -p .github/badges
          read COVERAGE_PCT BADGE_COLOR < <(node -e "const fs=require('fs'); const summary=JSON.parse(fs.readFileSync('coverage/nimmit/coverage-summary.json','utf8')); const pct=Number(summary?.total?.lines?.pct ?? summary?.total?.statements?.pct ?? 0); const rounded=(Math.round(pct*100)/100).toFixed(2); let color='red'; if(pct>=90) color='brightgreen'; else if(pct>=80) color='green'; else if(pct>=70) color='yellowgreen'; else if(pct>=60) color='yellow'; else if(pct>=50) color='orange'; process.stdout.write(`${rounded} ${color}`);")
          curl -sSL "https://img.shields.io/badge/coverage-${COVERAGE_PCT}%25-${BADGE_COLOR}.svg" -o .github/badges/coverage.svg

      - name: Commit coverage badge
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if git diff --quiet -- .github/badges/coverage.svg; then
            echo "Coverage badge unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git commit -m "chore: update coverage badge [skip ci]"
          git push

      - name: Upload coverage to Codecov (token)
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage/nimmit/lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage to Codecov (OIDC fallback)
        if: ${{ env.CODECOV_TOKEN == '' }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage/nimmit/lcov.info
          use_oidc: true
          disable_search: true
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
