name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Prepare PowerSync assets
        run: npm run powersync:setup

      - name: Generate coverage + component test HTML reports
        run: |
          mkdir -p reports/component-tests
          npm run test:coverage -- --reporters=html --output-file reports/component-tests/index.html

      - name: Build Angular app for GitHub Pages
        run: npm run build:pages

      - name: Add SPA fallback for GitHub Pages
        run: cp dist/nimmit/browser/index.html dist/nimmit/browser/404.html

      - name: Copy reports into GitHub Pages output
        run: |
          mkdir -p dist/nimmit/browser/reports
          cp -r reports/component-tests dist/nimmit/browser/reports/component-tests
          cp -r coverage/nimmit/lcov-report dist/nimmit/browser/reports/coverage

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/nimmit/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5