@if (!isPowerSyncReady()) {
  <section class="startup-screen" aria-live="polite" role="status" [attr.data-mode]="isDarkMode() ? 'dark' : 'light'">
    <div class="startup-glow" aria-hidden="true"></div>

    <div class="startup-card">
      <p class="startup-kicker">nimmit</p>
      <h1 class="startup-title">Syncing your data</h1>
      <p class="startup-subtitle">PowerSync is preparing your local database.</p>

      <div class="startup-spinner" aria-hidden="true"></div>

      <div class="startup-dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </section>
} @else {
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
  <div class="connection-status" [class.online]="isOnline()" [class.offline]="!isOnline()">
    <span class="status-icon" aria-hidden="true"></span>
    <em class="status-text">{{ isOnline() ? 'online' : 'offline' }}</em>
  </div>
  <app-navigation></app-navigation>
  <app-modal-container></app-modal-container>
}
