<div class="modal-content">
  <!-- Header -->
  <div class="modal-header">
    <h2 class="modal-title">Favorit bearbeiten</h2>
    <button class="close-btn" (click)="close()">
      <lucide-icon [img]="icons.X" [size]="24" [strokeWidth]="2"></lucide-icon>
    </button>
  </div>

  <!-- Form -->
  <form class="modal-form" (ngSubmit)="submit()">
    <!-- Produktname -->
    <div class="form-group">
      <label for="favName">Produktname *</label>
      <input
        type="text"
        id="favName"
        class="form-input"
        placeholder="z.B. Äpfel..."
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        name="favName"
        required
      />
    </div>

    <!-- Menge und Einheit -->
    <div class="form-row form-row-2">
      <div class="form-group">
        <label for="favSize">Menge (optional)</label>
        <input
          type="number"
          id="favSize"
          class="form-input"
          placeholder="z.B. 500"
          [ngModel]="size()"
          (ngModelChange)="setSize($event)"
          name="favSize"
          min="0"
          step="0.1"
        />
      </div>
      <div class="form-group">
        <label for="favUnit">Einheit</label>
        <select
          id="favUnit"
          class="form-select"
          [ngModel]="unit()"
          (ngModelChange)="setUnit($event)"
          name="favUnit"
        >
          @for (u of units; track u) {
            <option [value]="u">{{ u }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="submit-btn" [disabled]="!name().trim()">
      Speichern
    </button>
  </form>
</div>
